<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Masuk — Japanese High-Density Grid</title>
		<link rel="stylesheet" href="../sistem/style.css" />
	</head>
	<body>
		<div class="bar">
			<p>
				<b>Prototipe arah</b> — dunia <b>Japanese High-Density Grid</b>, layar Masuk. Nama toko
				di sini <b>contoh</b>; aslinya dibaca dari Pengaturan.
			</p>
			<p><a href="../kasir/index.html">layar Kasir</a></p>
		</div>

		<main class="board board--center">
			<section class="col">
				<div class="mod">
					<h1 class="strip__title">Toko Elektrik Maju</h1>
					<p class="strip__desc" style="margin-top: 4px">Kasir satu toko, satu terminal.</p>
				</div>

				<div class="mod mod--head">
					<h2 class="mod__title">Masuk</h2>
					<span class="mod__note">username &amp; password Pengguna</span>
				</div>

				<div class="mod">
					<div class="field">
						<label class="field__label" for="l-username">Username</label>
						<input id="l-username" class="input" autocomplete="username" autofocus />
					</div>
					<div class="field" style="margin-top: 8px">
						<label class="field__label" for="l-password">Password</label>
						<input id="l-password" class="input" type="password" autocomplete="current-password" />
					</div>
					<button class="btn btn--commit" type="button" style="margin-top: 12px">Masuk</button>
				</div>
			</section>
		</main>
	</body>
</html>
